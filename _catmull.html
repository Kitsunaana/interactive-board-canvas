<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Bezier & Spline Editor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b0b12;
      color: #cdd6f4;
      display: flex;
      flex-direction: column;
      height: 100vh;
      user-select: none;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      background: #14141f;
      align-items: center;
      border-bottom: 1px solid #2a2a3a;
    }

    .toolbar button {
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      background: #222233;
      color: #a6adc8;
      transition: .15s;
    }

    .toolbar button:hover {
      background: #33334a;
      color: #cdd6f4;
    }

    .toolbar button.active {
      background: #89b4fa;
      color: #111;
      font-weight: 600;
    }

    .toolbar .sep {
      width: 1px;
      height: 18px;
      background: #2a2a3a;
      margin: 0 2px;
    }

    .toolbar .info {
      margin-left: auto;
      font-size: 11px;
      color: #6c7086;
    }

    canvas {
      flex: 1;
      display: block;
      cursor: crosshair;
      background: #101018;
    }
  </style>
</head>

<body>

  <div class="toolbar">
    <button id="btnCubic" class="active">Cubic</button>
    <button id="btnQuad">Quad</button>
    <button id="btnCatmull">Catmull-Rom</button>
    <div class="sep"></div>
    <button id="btnClose">Замкнуть</button>
    <button id="btnClear">Очистить</button>
    <span class="info" id="status">Клик → якорь · Клик+тяни → кривая сразу · Двойной клик → замкнуть · Esc → завершить
      путь</span>
  </div>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const context = canvas.getContext('2d');
    const status = document.getElementById('status');

    let mode = 'catmull';
    let nodes = [];     // [{x, y, cpIn: {x,y}, cpOut: {x,y}}, ...]
    let drawing = false;
    let closed = false;
    let drag = null;    // {type, idx, sub, sx, sy, startNode}
    let mouse = { x: 0, y: 0 };

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      render();
    }

    window.addEventListener('resize', resize);

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function getPosition(e) {
      const r = canvas.getBoundingClientRect();
      return {
        x: e.clientX - r.left,
        y: e.clientY - r.top,
      };
    }

    function hitTest(p) {
      const R = 8;
      for (let i = 0; i < nodes.length; i++) {
        if (distance(p, nodes[i]) <= R) {
          return {
            type: 'anchor',
            idx: i,
          };
        }
      }

      return null;
    }

    /* ───── MOUSE ───── */
    canvas.addEventListener('mousedown', (event) => {
      const pointerPosition = getPosition(event);
      mouse = pointerPosition;

      const hit = hitTest(pointerPosition);
      if (hit) {
        const node = nodes[hit.idx];

        drag = {
          type: hit.type,
          idx: hit.idx,
          sub: hit.sub || null,
          sx: pointerPosition.x,
          sy: pointerPosition.y,
          startNode: {
            x: node.x,
            y: node.y,
            cpIn: { ...(node.cpIn || { x: 0, y: 0 }) },
            cpOut: { ...(node.cpOut || { x: 0, y: 0 }) }
          }
        };

        return;
      }

      if (drawing) {
        nodes.push({
          x: pointerPosition.x,
          y: pointerPosition.y,
          cpIn: {
            x: pointerPosition.x,
            y: pointerPosition.y,
          },
          cpOut: {
            x: pointerPosition.x,
            y: pointerPosition.y,
          }
        });
      } else {
        nodes = [
          {
            x: pointerPosition.x,
            y: pointerPosition.y,
            cpIn: {
              x: pointerPosition.x,
              y: pointerPosition.y,
            },
            cpOut: {
              x: pointerPosition.x,
              y: pointerPosition.y,
            }
          }
        ];

        drawing = true;
        closed = false;
      }

      updateStatus();
      render();
    });

    canvas.addEventListener('mousemove', (event) => {
      mouse = getPosition(event);

      if (!drag) {
        const hit = hitTest(mouse);
        canvas.style.cursor = hit ? 'grab' : (drawing ? 'crosshair' : 'default');
        if (drawing) render();
        return;
      }

      const dx = mouse.x - drag.sx;
      const dy = mouse.y - drag.sy;
      const n = nodes[drag.idx];

      if (drag.type === 'anchor') {
        n.x = drag.startNode.x + dx;
        n.y = drag.startNode.y + dy;
      }

      render();
    });

    canvas.addEventListener('mouseup', () => {
      if (drag) {
        drag = null;
        render();
      }
    });

    canvas.addEventListener('dblclick', () => {
      if (drawing && nodes.length >= 2) {
        closed = true;
        drawing = false;
        updateStatus();
        render();
      }
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        drawing = false;
        drag = null;
        updateStatus();
        render();
      }
    });

    /* ───── UI ───── */
    function setBtn(id) { document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    document.getElementById('btnCubic').onclick = () => { mode = 'cubic'; setBtn('btnCubic'); render(); };
    document.getElementById('btnQuad').onclick = () => { mode = 'quad'; setBtn('btnQuad'); render(); };
    document.getElementById('btnCatmull').onclick = () => { mode = 'catmull'; setBtn('btnCatmull'); render(); };
    document.getElementById('btnClose').onclick = () => { if (drawing && nodes.length >= 2) { closed = true; drawing = false; updateStatus(); render(); } };
    document.getElementById('btnClear').onclick = () => { nodes = []; closed = false; drawing = false; drag = null; updateStatus(); render(); };

    function updateStatus() {
      if (nodes.length === 0) status.textContent = 'Клик → первый якорь';
      else if (!closed && drawing) status.textContent = `Точек: ${nodes.length} · Клик+тяни → кривая сразу · Двойной клик / "Замкнуть"`;
      else if (closed) status.textContent = 'Путь замкнут · Тяни точки';
      else status.textContent = `Точек: ${nodes.length} · Завершено · Тяни точки или клик в пустоту → новый путь`;
    }

    /* ───── RENDER ───── */
    function render() {
      const W = canvas.clientWidth
      const H = canvas.clientHeight;
      context.clearRect(0, 0, W, H);

      context.strokeStyle = '#1a1a24';
      context.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        context.beginPath();
        context.moveTo(x, 0);
        context.lineTo(x, H);
        context.stroke();
      }
      for (let y = 0; y < H; y += 40) {
        context.beginPath();
        context.moveTo(0, y);
        context.lineTo(W, y);
        context.stroke();
      }

      if (nodes.length === 0) return;

      drawCatmullCurve(nodes, '#89b4fa', 2.5, false);

      if (drawing && !closed && !drag) {
        const previewPts = [...nodes, { x: mouse.x, y: mouse.y }];
        drawCatmullCurve(previewPts, '#a6e3a1', 3, true);
      }

      if (drawing && !closed && !drag) {
        const last = nodes[nodes.length - 1];

        context.beginPath();
        context.moveTo(last.x, last.y);
        context.lineTo(mouse.x, mouse.y);

        context.strokeStyle = 'rgba(137,180,250,0.4)';
        context.lineWidth = 1; context.setLineDash([4, 4]);
        context.stroke();
        context.setLineDash([]);
      }

      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        const isDrag = drag && drag.idx === i;
        const color = isDrag ? '#f38ba8' : (mode === 'catmull' ? '#94e2d5' : '#a6e3a1');

        drawDot(n, color, isDrag ? 7 : 5);
      }
    }

    function drawBezierCurve() {
      context.beginPath();
      context.moveTo(nodes[0].x, nodes[0].y);

      for (let i = 1; i < nodes.length; i++) {
        context.quadraticCurveTo(
          nodes[i].cpIn.x,
          nodes[i].cpIn.y,
          nodes[i].x,
          nodes[i].y
        );
      }

      if (closed && nodes.length > 2) {
        const last = nodes[nodes.length - 1];
        const first = nodes[0];

        const cpX = last.x + (last.x - last.cpIn.x);
        const cpY = last.y + (last.y - last.cpIn.y);
        context.quadraticCurveTo(cpX, cpY, first.x, first.y);
      }

      context.strokeStyle = '#89b4fa';
      context.lineWidth = 2.5;
      context.lineJoin = 'round';
      context.lineCap = 'round';
      context.stroke();

      if (closed) {
        context.fillStyle = 'rgba(137,180,250,0.06)';
        context.fill();
      }
    }

    function drawCatmullCurve(pts, color, width, isPreview) {
      if (pts.length < 2) return;

      context.beginPath();
      context.moveTo(pts[0].x, pts[0].y);

      context.strokeStyle = color;
      context.lineWidth = width;
      context.lineJoin = 'round';
      context.lineCap = 'round';

      if (isPreview) context.setLineDash([5, 4]);

      const n = pts.length;
      const segments = closed ? n : n - 1;

      for (let i = 0; i < segments; i++) {
        const idx = i % n;
        const nextIdx = (i + 1) % n;
        const p0 = closed ? pts[(idx - 1 + n) % n] : (idx === 0 ? pts[0] : pts[idx - 1]);
        const p1 = pts[idx];
        const p2 = pts[nextIdx];
        const p3 = closed ? pts[(idx + 2) % n] : (nextIdx === n - 1 ? pts[n - 1] : pts[idx + 2]);

        const cp1x = p1.x + (p2.x - p0.x) / 6;
        const cp1y = p1.y + (p2.y - p0.y) / 6;
        const cp2x = p2.x - (p3.x - p1.x) / 6;
        const cp2y = p2.y - (p3.y - p1.y) / 6;
        context.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
      }

      context.stroke();
      if (isPreview) context.setLineDash([]);
      if (!isPreview && closed && n > 2) {
        context.fillStyle = 'rgba(137,180,250,0.06)';
        context.fill();
      }
    }

    function drawDot(p, color, r) {
      context.beginPath();
      context.arc(p.x, p.y, r, 0, Math.PI * 2);
      context.fillStyle = color;
      context.fill();
      context.strokeStyle = '#101018';
      context.lineWidth = 2;
      context.stroke();
    }

    resize();
  </script>
</body>

</html>
